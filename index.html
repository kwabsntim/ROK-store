<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerslide Store Clone</title>
    <!-- Importing Google Fonts for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet">
    <!-- Font Awesome for the header icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <!-- Logo Placeholder -->
            <div class="logo">
                <span class="logo-circle">ROK</span>
            </div>
            
            <!-- Main Navigation Links -->
            <nav class="nav-links">
                <a href="#">INLINE SKATES</a>
                <a href="#">ROLLER SKATES</a>
                <a href="#">SKATE FRAMES</a>
                <a href="#">SAFETY GEARS</a>
                <a href="#">ACCESSORIES</a>
                <a href="#">BLOG</a>
                
            </nav>
            
            <!-- Search and Icons Menu -->
            <div class="nav-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
                <a href="#" class="icon-link"><i class="fa-regular fa-user"></i></a>
                <a href="#" class="icon-link cart-icon">
                    <i class="fa-solid fa-basket-shopping"></i>

                </a>
            </div>
        </div>
    </header>

    <!-- Full-Screen Hero Section with Video Background -->
    <section class="hero-section">
        <!-- The Background Video HTML Tag -->
        <video class="bg-video" autoplay loop muted playsinline>
            <!-- Replace the src below with your actual local video file path or an online link -->
            <source src="/Assets/ROK skate plug.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="hero-overlay"></div>
        <div class="hero-content"><br><br><br>
            <h1>ROK Skate Plug</h1>
            <h3>Dealers in Premium Inline Skates, Roller Skates, skate frames, Safety gears & Accessories</h3>
            <div class="hero-buttons">
                <a href="#" class="pill-btn">Shop Skates</a>
                <a href="#" class="pill-btn">Explore Blog</a>
            </div>
        </div>
    </section>

  

</body>
</html>
