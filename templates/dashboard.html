<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — ROK Skates</title>
    <link rel="icon" type="image/png" href="/Assets/favicon.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Styles/dashboard.css">
</head>
<body>

    <!-- ── Top Bar ── -->
    <header class="topbar">
        <a class="topbar-logo" href="/index.html">
            <img src="/Assets/ROKlogo.png" alt="ROK Store">
        </a>
        <div class="topbar-right">
            <span class="admin-badge">Admin</span>
            <span class="admin-name" id="admin-name">—</span>
            <button class="logout-btn" id="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>

    <div class="dashboard-body">

        <!-- ── Sidebar ── -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#" class="active" data-panel="products">
                    <i class="fa-solid fa-box"></i> Products
                </a>
                <a href="#" data-panel="overview">
                    <i class="fa-solid fa-chart-simple"></i> Overview
                </a>
            </nav>
        </aside>

        <!-- ── Main ── -->
        <main class="main-content">

            <!-- PRODUCTS PANEL -->
            <section class="panel active" id="panel-products">
                <div class="section-header">
                    <h2>Products</h2>
                    <button class="btn-primary" id="open-add-modal">
                        <i class="fa-solid fa-plus"></i> Add Product
                    </button>
                </div>

                <div class="table-wrapper" id="products-table-wrapper">
                    <div class="spinner" id="products-spinner"></div>
                    <table class="products-table" id="products-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody"></tbody>
                    </table>
                    <div class="empty-state" id="products-empty" style="display:none;">
                        <i class="fa-regular fa-box-open"></i>
                        <p>No products yet. Add your first one!</p>
                    </div>
                </div>
            </section>

            <!-- OVERVIEW PANEL -->
            <section class="panel" id="panel-overview">
                <div class="section-header">
                    <h2>Overview</h2>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-box"></i></div>
                        <div class="stat-label">Total Products</div>
                        <div class="stat-value" id="stat-products">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="stat-label">Low Stock (≤5)</div>
                        <div class="stat-value" id="stat-lowstock">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-ban"></i></div>
                        <div class="stat-label">Out of Stock</div>
                        <div class="stat-value" id="stat-outofstock">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-receipt"></i></div>
                        <div class="stat-label">Total Orders</div>
                        <div class="stat-value" id="stat-orders">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-money-bill-wave"></i></div>
                        <div class="stat-label">Revenue (Paid)</div>
                        <div class="stat-value" id="stat-revenue">—</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- ════════════════════════════════
         ADD / EDIT PRODUCT MODAL
    ════════════════════════════════ -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">Add Product</h3>
                <button class="modal-close" id="close-modal" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form class="modal-form" id="product-form" novalidate>
                <input type="hidden" id="product-id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="f-name">Name *</label>
                        <input type="text" id="f-name" placeholder="ROK Classic Deck" required>
                    </div>
                    <div class="form-group">
                        <label for="f-category">Category *</label>
                        <select id="f-category" required>
                            <option value="" disabled selected>Select…</option>
                            <option value="decks">Decks</option>
                            <option value="inline-skates">Inline Skates</option>
                            <option value="roller-skates">Roller Skates</option>
                            <option value="frames">Skate Frames</option>
                            <option value="safety-gear">Safety Gear</option>
                            <option value="accessories">Accessories</option>
                            <option value="apparel">Apparel</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="f-price">Price (GHS) *</label>
                        <input type="number" id="f-price" placeholder="120.00" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="f-stock">Stock *</label>
                        <input type="number" id="f-stock" placeholder="10" min="0" step="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="f-size">Size</label>
                        <input type="text" id="f-size" placeholder='e.g. 8.0, M, L'>
                    </div>
                    <div class="form-group">
                        <label for="f-image-url">Primary Image URL</label>
                        <input type="url" id="f-image-url" placeholder="https://res.cloudinary.com/…">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="f-description">Description</label>
                    <textarea id="f-description" placeholder="Describe the product…"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="f-images">Extra Image URLs <span style="font-weight:400;text-transform:none;letter-spacing:0">(comma-separated)</span></label>
                    <input type="text" id="f-images" placeholder="https://…, https://…">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="cancel-modal">Cancel</button>
                    <button type="submit" class="btn-primary" id="save-btn">
                        <i class="fa-solid fa-floppy-disk"></i> Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        // ════════════════════════════════
        // CONFIG
        // ════════════════════════════════
        const API = 'http://localhost:8080';

        // ════════════════════════════════
        // AUTH GUARD — redirect if not admin
        // ════════════════════════════════
        const storedUser  = sessionStorage.getItem('rok_user');
        const storedToken = sessionStorage.getItem('rok_token');

        if (!storedToken || !storedUser) {
            window.location.replace('/templates/login.html');
        }

        const currentUser = JSON.parse(storedUser);

        if (currentUser?.role !== 'admin') {
            window.location.replace('/templates/login.html');
        }

        document.getElementById('admin-name').textContent = currentUser.name || currentUser.email;

        // ════════════════════════════════
        // HELPERS
        // ════════════════════════════════
        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${storedToken}`,
            };
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className   = 'toast' + (isError ? ' error' : '');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ════════════════════════════════
        // SIDEBAR NAVIGATION
        // ════════════════════════════════
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                const target = link.dataset.panel;
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + target).classList.add('active');

                if (target === 'overview') loadOverview();
            });
        });

        // ════════════════════════════════
        // LOGOUT
        // ════════════════════════════════
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await fetch(`${API}/api/auth/logout`, { method: 'POST' });
            } catch { /* ignore */ }
            sessionStorage.clear();
            window.location.replace('/templates/login.html');
        });

        // ════════════════════════════════
        // LOAD PRODUCTS
        // ════════════════════════════════
        let allProducts = [];

        async function loadProducts() {
            const spinner  = document.getElementById('products-spinner');
            const table    = document.getElementById('products-table');
            const empty    = document.getElementById('products-empty');
            const tbody    = document.getElementById('products-tbody');

            spinner.style.display = 'flex';
            table.style.display   = 'none';
            empty.style.display   = 'none';

            try {
                const res  = await fetch(`${API}/api/products?page_size=100`);
                const data = await res.json();
                allProducts = data.products || [];
            } catch {
                showToast('Failed to load products.', true);
                spinner.style.display = 'none';
                return;
            }

            spinner.style.display = 'none';

            if (allProducts.length === 0) {
                empty.style.display = 'block';
                return;
            }

            tbody.innerHTML = allProducts.map(p => `
                <tr>
                    <td>
                        ${p.image_url
                            ? `<img class="product-thumb" src="${escHtml(p.image_url)}" alt="${escHtml(p.name)}">`
                            : `<div class="product-thumb-placeholder"><i class="fa-regular fa-image"></i></div>`
                        }
                    </td>
                    <td><span class="product-name">${escHtml(p.name)}</span></td>
                    <td>${escHtml(p.category)}</td>
                    <td>GHS ${Number(p.price).toFixed(2)}</td>
                    <td>${stockBadge(p.stock)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn-secondary" onclick="openEditModal('${p.id}')">
                                <i class="fa-regular fa-pen-to-square"></i> Edit
                            </button>
                            <button class="btn-danger" onclick="deleteProduct('${p.id}', '${escHtml(p.name)}')">
                                <i class="fa-regular fa-trash-can"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            table.style.display = 'table';
        }

        function stockBadge(stock) {
            if (stock === 0)  return `<span class="badge badge-stock-out">Out of stock</span>`;
            if (stock <= 5)   return `<span class="badge badge-stock-low">${stock} left</span>`;
            return `<span class="badge badge-stock-ok">${stock} in stock</span>`;
        }

        function escHtml(str) {
            return String(str ?? '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ════════════════════════════════
        // OVERVIEW STATS
        // ════════════════════════════════
        async function loadOverview() {
            if (allProducts.length === 0) {
                try {
                    const res  = await fetch(`${API}/api/products?page_size=100`);
                    const data = await res.json();
                    allProducts = data.products || [];
                } catch {
                    showToast('Failed to load stats.', true);
                    return;
                }
            }
            document.getElementById('stat-products').textContent   = allProducts.length;
            document.getElementById('stat-lowstock').textContent   = allProducts.filter(p => p.stock > 0 && p.stock <= 5).length;
            document.getElementById('stat-outofstock').textContent = allProducts.filter(p => p.stock === 0).length;

            // Orders + revenue
            try {
                const res = await fetch(`${API}/api/admin/orders`, { headers: authHeaders() });
                if (res.ok) {
                    const orders  = await res.json();
                    const paid    = (orders || []).filter(o => o.payment_status === 'paid');
                    const revenue = paid.reduce((sum, o) => sum + (o.total_amount || 0), 0);
                    document.getElementById('stat-orders').textContent  = (orders || []).length;
                    document.getElementById('stat-revenue').textContent =
                        'GHS\u00a0' + revenue.toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                } else {
                    document.getElementById('stat-orders').textContent  = 'N/A';
                    document.getElementById('stat-revenue').textContent = 'N/A';
                }
            } catch {
                document.getElementById('stat-orders').textContent  = 'N/A';
                document.getElementById('stat-revenue').textContent = 'N/A';
            }
        }

        // ════════════════════════════════
        // MODAL — OPEN / CLOSE
        // ════════════════════════════════
        const modal        = document.getElementById('product-modal');
        const modalTitle   = document.getElementById('modal-title');
        const productForm  = document.getElementById('product-form');

        function openModal(title) {
            modalTitle.textContent = title;
            modal.classList.add('open');
            document.getElementById('f-name').focus();
        }

        function closeModal() {
            modal.classList.remove('open');
            productForm.reset();
            document.getElementById('product-id').value = '';
        }

        document.getElementById('open-add-modal').addEventListener('click', () => {
            closeModal();
            openModal('Add Product');
        });

        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('cancel-modal').addEventListener('click', closeModal);

        // Close on overlay click
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

        // ════════════════════════════════
        // MODAL — OPEN FOR EDIT
        // ════════════════════════════════
        function openEditModal(id) {
            const p = allProducts.find(x => x.id === id);
            if (!p) return;

            document.getElementById('product-id').value    = p.id;
            document.getElementById('f-name').value        = p.name;
            document.getElementById('f-category').value   = p.category;
            document.getElementById('f-price').value      = p.price;
            document.getElementById('f-stock').value      = p.stock;
            document.getElementById('f-size').value       = p.size        || '';
            document.getElementById('f-image-url').value  = p.image_url   || '';
            document.getElementById('f-description').value = p.description || '';

            // images is a JSON array string — display as comma-separated URLs
            let imagesDisplay = '';
            if (p.images) {
                try {
                    imagesDisplay = JSON.parse(p.images).join(', ');
                } catch {
                    imagesDisplay = p.images;
                }
            }
            document.getElementById('f-images').value = imagesDisplay;

            openModal('Edit Product');
        }

        // ════════════════════════════════
        // SAVE PRODUCT (Create or Update)
        // ════════════════════════════════
        productForm.addEventListener('submit', async e => {
            e.preventDefault();

            const id          = document.getElementById('product-id').value;
            const name        = document.getElementById('f-name').value.trim();
            const category    = document.getElementById('f-category').value;
            const price       = parseFloat(document.getElementById('f-price').value);
            const stock       = parseInt(document.getElementById('f-stock').value, 10);
            const size        = document.getElementById('f-size').value.trim();
            const image_url   = document.getElementById('f-image-url').value.trim();
            const description = document.getElementById('f-description').value.trim();

            // Convert comma-separated image URLs → JSON array string
            const imagesRaw = document.getElementById('f-images').value.trim();
            const images    = imagesRaw
                ? JSON.stringify(imagesRaw.split(',').map(s => s.trim()).filter(Boolean))
                : '';

            if (!name || !category || isNaN(price) || price <= 0 || isNaN(stock)) {
                showToast('Please fill in all required fields.', true);
                return;
            }

            const payload = { name, category, price, stock, size, image_url, description, images };

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;

            try {
                const isEdit = Boolean(id);
                const url    = isEdit
                    ? `${API}/api/admin/products/${id}`
                    : `${API}/api/admin/products`;
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: authHeaders(),
                    body:    JSON.stringify(payload),
                });

                if (!res.ok) {
                    const err = await res.text();
                    showToast(err || 'Failed to save product.', true);
                    return;
                }

                showToast(isEdit ? 'Product updated!' : 'Product created!');
                closeModal();
                await loadProducts();

            } catch {
                showToast('Network error. Please try again.', true);
            } finally {
                saveBtn.disabled = false;
            }
        });

        // ════════════════════════════════
        // DELETE PRODUCT
        // ════════════════════════════════
        async function deleteProduct(id, name) {
            if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;

            try {
                const res = await fetch(`${API}/api/admin/products/${id}`, {
                    method:  'DELETE',
                    headers: authHeaders(),
                });

                if (!res.ok) {
                    showToast('Failed to delete product.', true);
                    return;
                }

                showToast(`"${name}" deleted.`);
                await loadProducts();

            } catch {
                showToast('Network error. Please try again.', true);
            }
        }

        // ════════════════════════════════
        // INIT
        // ════════════════════════════════
        loadProducts();
    </script>

</body>
</html>
